#
# WeAct STM32H750 Mini - openocd 기본 설정
#
#   openocd -f tools/openocd/weact-h750.cfg -c "program build/weact-h750-boot.elf verify reset exit"
#
# 이 머신(macOS 12.7.6)에서는 STM32_Programmer_CLI 가 실행되지 않고
# (CubeProgrammer 의 Qt 가 macOS 13 이상을 요구한다) pyocd 도 파이썬 모듈이 없다.
# 따라서 SWD 경로는 openocd 하나로 통일한다.
#
source [find interface/stlink.cfg]

# transport 는 **지정하지 않는다.** openocd 가 어댑터가 지원하는 첫 번째 것을 고른다.
#
#   homebrew openocd 의 interface/stlink.cfg 는 `adapter driver hla` 라 hla_swd 가 되고,
#   ST 가 배포하는 openocd 포크는 `adapter driver st-link`(DAP) 라 dapdirect_swd 가 된다.
#   `transport select hla_swd` 를 박아두면 후자에서
#   "Debug adapter doesn't support 'hla_swd' transport" 로 죽는다.
#   지정하지 않으면 양쪽 다 돈다.

set CHIPNAME stm32h750vbt6

source [find target/stm32h7x.cfg]

# 이 보드에서는 SRST 를 쓰면 안 된다.
#   NRST 를 MAX809TEUR 수퍼바이저가 구동하고 있어서 ST-LINK 가 끌어당겨도
#   halt 타이밍을 잡지 못한다 (실측: "timed out while waiting for target halted").
#   reset_config none 으로 두면 openocd 가 SYSRESETREQ(소프트웨어 리셋)를 쓴다.
#   백업 도메인(RTC 레지스터)은 보존되므로 부트 모드 플래그 복구 경로와도 맞는다.
reset_config none separate

# 1.8MHz 기본값에서 올린다. 이 보드는 4MHz 에서 안정적이다.
adapter speed 4000
